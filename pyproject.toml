[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "my_app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=1.0.3",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "radon>=6.0.1",
    "requests>=2.32.5",
    "ruff>=0.15.4",
    "streamlit>=1.55.0",
    "supabase>=2.28.3",
    "uvicorn>=0.46.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest",
        "ruff"
]

[project.scripts]
library = "my_app.cli:app"
